name: Teaching lab checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt pytest
      - run: python -m compileall -q src tests
      - run: python -m pytest -q
